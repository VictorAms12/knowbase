name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate backend and build frontend
        run: npm run check

      - name: Smoke test knowledge importer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf server/data server/uploads
          mkdir -p /tmp/knowbase-import-fixture
          cat > /tmp/knowbase-import-fixture/ABERTURA_DE_CAIXA.txt <<'EOF'
          Abertura de caixa
          1. Acessar Financeiro > Caixa.
          2. Selecionar o caixa e o usuário.
          3. Confirmar a abertura.
          EOF

          npm run import:knowledge -- /tmp/knowbase-import-fixture
          npm run import:knowledge -- /tmp/knowbase-import-fixture

          node --input-type=module <<'EOF'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('server/data/knowbase.db');
          const imported = Number(db.prepare("SELECT COUNT(*) c FROM knowledge_import_sources").get().c);
          const steps = Number(db.prepare("SELECT COUNT(*) c FROM procedure_steps ps JOIN articles a ON a.id=ps.article_id WHERE a.title LIKE '%ABERTURA%' COLLATE NOCASE").get().c);
          if (imported !== 1) throw new Error(`Importação não idempotente: ${imported} fontes.`);
          if (steps < 3) throw new Error(`Passos não detectados: ${steps}.`);
          console.log({ imported, steps });
          EOF

      - name: Smoke test operational API
        shell: bash
        run: |
          set -euo pipefail
          npm run start --workspace server > /tmp/knowbase-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; cat /tmp/knowbase-server.log' EXIT

          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3333/api/health >/dev/null; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent http://127.0.0.1:3333/api/health
          curl --fail --silent http://127.0.0.1:3333/api/articles > /tmp/articles.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const articles = JSON.parse(fs.readFileSync('/tmp/articles.json', 'utf8'));
          const imported = articles.find(article => /ABERTURA/i.test(article.title));
          if (!imported) throw new Error('Artigo importado não retornado pela API.');
          if (/Conteúdo de referência/i.test(imported.body_html || '')) throw new Error('Texto extraído bruto ainda está visível no corpo do artigo.');
          if (!/Visualização do conteúdo/i.test(imported.body_html || '')) throw new Error('Aviso de visualização limpa não foi aplicado.');
          EOF
          curl --fail --silent http://127.0.0.1:3333/api/ops/dashboard
          curl --fail --silent http://127.0.0.1:3333/api/scripts
          curl --fail --silent http://127.0.0.1:3333/api/diagnostics
          curl --fail --silent http://127.0.0.1:3333/api/procedures
          curl --fail --silent -X POST http://127.0.0.1:3333/api/quick-capture \
            -H 'content-type: application/json' \
            -H 'x-user-id: 1' \
            --data '{"problem":"Falha de teste CI","solution":"Procedimento de teste concluído","tags":"CI"}'
          curl --fail --silent 'http://127.0.0.1:3333/api/search-unified?q=teste'
